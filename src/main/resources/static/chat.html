<!DOCTYPE html>
<html>
<head>
    <title>Chat Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        #messages { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
        .message { margin: 8px 0; padding: 8px 12px; border-radius: 8px; max-width: 70%; word-wrap: break-word; }
        .sent { background: #dcf8c6; margin-left: auto; text-align: right; }
        .received { background: #f0f0f0; }
        input { padding: 8px; margin: 4px 0; width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px; margin: 4px 0; width: 100%; box-sizing: border-box; background: #075e54; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #status { font-size: 13px; color: gray; }
    </style>
</head>
<body>
<h3>Chat Test</h3>
<p id="status">Disconnected</p>

<input type="number" id="senderId" placeholder="Your ID"/>
<input type="number" id="receiverId" placeholder="Receiver ID"/>
<input type="number" id="carId" placeholder="Car ID"/>
<button id="connectBtn" onclick="connect()">Connect</button>

<div id="messages"></div>

<input type="text" id="messageInput" placeholder="Type a message..." disabled/>
<button onclick="sendMessage()" id="sendBtn" disabled>Send</button>

<script>
    let stompClient = null;
    let myId = null;
    let receiverId = null;
    let carId = null;
    let conversationId = null;

    function connect() {
        myId = parseInt(document.getElementById('senderId').value);
        receiverId = parseInt(document.getElementById('receiverId').value);
        carId = parseInt(document.getElementById('carId').value);

        if (!myId || !receiverId || !carId) {
            alert('Please fill all fields!');
            return;
        }

        document.getElementById('status').innerText = 'Connecting...';

        const socket = new SockJS('http://localhost:8082/ws');
        stompClient = Stomp.over(socket);
        stompClient.debug = null;

        stompClient.connect({}, function () {
            document.getElementById('status').innerText = '🟢 Connected';
            document.getElementById('connectBtn').disabled = true;
            document.getElementById('messageInput').disabled = false;
            document.getElementById('sendBtn').disabled = false;

            // conversation ID öyrənmək üçün REST endpoint-ə soruş
            fetch(`http://localhost:8080/api/chat/conversation?buyerId=${myId}&sellerId=${receiverId}&carId=${carId}`)
                .then(r => r.json())
                .then(data => {
                    conversationId = data.conversationId;
                    subscribeToConversation(conversationId);
                    loadOldMessages(conversationId);
                })
                .catch(() => {
                    // conversation yoxdursa mesaj göndərəndə yaranacaq
                    conversationId = null;
                });

        }, function (error) {
            document.getElementById('status').innerText = '🔴 Connection failed: ' + error;
        });
    }

    function subscribeToConversation(convId) {
        stompClient.subscribe('/topic/conversation.' + convId, function (msg) {
            const data = JSON.parse(msg.body);
            showMessage(data);
        });
    }

    function loadOldMessages(convId) {
        fetch(`http://localhost:8080/api/chat/messages/${convId}`)
            .then(r => r.json())
            .then(messages => {
                messages.forEach(msg => showMessage(msg));
            });
    }

    function sendMessage() {
        const content = document.getElementById('messageInput').value.trim();
        if (!content) return;

        stompClient.send('/app/sendMessage', {}, JSON.stringify({
            senderId: myId,
            receiverId: receiverId,
            carId: carId,
            content: content
        }));

        document.getElementById('messageInput').value = '';
    }

    function showMessage(data) {
        const div = document.createElement('div');
        div.className = 'message ' + (data.senderId == myId ? 'sent' : 'received');
        div.innerText = data.content;
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = 999999;
    }

    document.getElementById('messageInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') sendMessage();
    });
</script>
</body>
</html>
